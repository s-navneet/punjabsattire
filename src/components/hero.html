<!-- Main Hero: Coming Soon Banner with Center HTML -->
<main
    class="hero-banner relative flex-grow min-h-[calc(100vh-66px)] flex flex-col justify-center items-center px-4 sm:px-6 py-6 sm:py-8 md:py-14 text-center"
>
    <!-- Mobile Vignette Backdrop (Invisible on Desktop to reveal side image elements) -->
    <div class="absolute inset-0 hero-mobile-overlay md:bg-transparent pointer-events-none"></div>

    <!-- Center Content Container (Responsive & Centered) -->
    <div
        class="relative z-10 w-full max-w-xl mx-auto flex flex-col items-center text-center -translate-y-2 sm:-translate-y-8 md:-translate-y-16 lg:-translate-y-20 px-2 sm:px-0"
    >
        <!-- Category Tagline -->
        <div class="flex items-center justify-center gap-2 mb-2">
            <span class="w-6 h-px bg-[#e5a93c]/60"></span>
            <span
                class="text-[10px] sm:text-xs uppercase tracking-[0.18em] font-medium text-[#e5a93c] drop-shadow"
                >Your Everyday Style Destination</span
            >
            <span class="w-6 h-px bg-[#e5a93c]/60"></span>
        </div>

        <!-- Main Heading -->
        <h1
            class="serif-title text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight leading-tight drop-shadow-xl"
        >
            <span class="text-white block">Something</span>
            <span class="text-[#e5a93c] block mt-0.5 pb-0.5 drop-shadow-lg">Is Coming Soon</span>
        </h1>

        <!-- Subheading -->
        <p
            class="text-gray-200 text-xs sm:text-sm max-w-md mt-2.5 mb-4 sm:mb-5 leading-relaxed drop-shadow px-2"
        >
            Trendy Shirts, Premium T-Shirts, Comfortable Lowers &amp; More &ndash; Only at Punjab's Attire.
        </p>

        <!-- <div id="countdown-timer" class="flex items-center justify-center gap-2 sm:gap-3 mb-5 sm:mb-6 bg-[#071120]/80 border border-[#d4af37]/30 px-3 sm:px-4 py-2 rounded-xl backdrop-blur-sm shadow-lg">
            <div class="flex flex-col items-center px-1"><span id="days" class="text-base sm:text-lg font-bold text-[#e5a93c] leading-none">00</span><span class="text-[9px] uppercase tracking-wider text-gray-400 mt-0.5">Days</span></div>
            <span class="text-[#e5a93c]/60 font-bold">:</span>
            <div class="flex flex-col items-center px-1"><span id="hours" class="text-base sm:text-lg font-bold text-[#e5a93c] leading-none">00</span><span class="text-[9px] uppercase tracking-wider text-gray-400 mt-0.5">Hours</span></div>
            <span class="text-[#e5a93c]/60 font-bold">:</span>
            <div class="flex flex-col items-center px-1"><span id="minutes" class="text-base sm:text-lg font-bold text-[#e5a93c] leading-none">00</span><span class="text-[9px] uppercase tracking-wider text-gray-400 mt-0.5">Mins</span></div>
            <span class="text-[#e5a93c]/60 font-bold">:</span>
            <div class="flex flex-col items-center px-1"><span id="seconds" class="text-base sm:text-lg font-bold text-[#e5a93c] leading-none">00</span><span class="text-[9px] uppercase tracking-wider text-gray-400 mt-0.5">Secs</span></div>
        </div> -->

        <!-- 4 Features / Pillars -->
        <div class="grid grid-cols-4 w-full mb-5 sm:mb-6 divide-x divide-slate-700/60">
            <div class="flex flex-col items-center px-1">
                <svg
                    class="w-4 h-4 sm:w-5 sm:h-5 mb-1 text-[#e5a93c]"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                </svg>
                <span class="text-[9px] sm:text-xs font-medium text-gray-200 leading-tight"
                    >Trendy<br />Collection</span
                >
            </div>
            <div class="flex flex-col items-center px-1">
                <svg
                    class="w-4 h-4 sm:w-5 sm:h-5 mb-1 text-[#e5a93c]"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.75 8.25L12 2.25l8.25 6L12 21.75 3.75 8.25zM3.75 8.25h16.5"
                    />
                </svg>
                <span class="text-[9px] sm:text-xs font-medium text-gray-200 leading-tight"
                    >Surplus<br />Quality</span
                >
            </div>
            <div class="flex flex-col items-center px-1">
                <svg
                    class="w-4 h-4 sm:w-5 sm:h-5 mb-1 text-[#e5a93c]"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8.25 18.75a1.5 1.5 0 11-3 0m3 0h6m-9 0H3.375A1.125 1.125 0 012.25 17.625V14.25m17.25 4.5a1.5 1.5 0 11-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.9 17.9 0 00-3.213-9.193 2.06 2.06 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.25V18.75m0-11.25H4.875c-.621 0-1.125.504-1.125 1.125v6"
                    />
                </svg>
                <span class="text-[9px] sm:text-xs font-medium text-gray-200 leading-tight"
                    >Fast &amp; Safe<br />Delivery</span
                >
            </div>
            <div class="flex flex-col items-center px-1">
                <svg
                    class="w-4 h-4 sm:w-5 sm:h-5 mb-1 text-[#e5a93c]"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.36-2l1.26 12c.07.67-.45 1.25-1.12 1.25H4.25c-.67 0-1.19-.58-1.12-1.25l1.26-12c.06-.57.54-1 1.12-1h12.97c.58 0 1.06.43 1.12 1z"
                    />
                </svg>
                <span class="text-[9px] sm:text-xs font-medium text-gray-200 leading-tight"
                    >Affordable<br />Style</span
                >
            </div>
        </div>

        <!-- Notification Form -->
        <form id="notify-form" class="w-full mb-3 sm:mb-4">
            <input
                type="text"
                name="_bot_check"
                id="bot-check"
                class="hidden"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true"
            />

            <div
                class="bg-[#071120]/90 border border-[#d4af37]/45 rounded-xl p-2 sm:p-1.5 backdrop-blur-md shadow-2xl"
            >
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-1.5 mb-2 sm:mb-1.5">
                    <!-- WhatsApp -->
                    <div
                        class="flex items-center bg-[#0b172a]/90 border border-slate-700/60 rounded-lg px-3 py-2 sm:px-2 sm:py-1.5 gold-focus transition"
                    >
                        <svg
                            class="w-4 h-4 text-[#25D366] shrink-0 mr-2 sm:mr-1.5 fill-current"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"
                            />
                        </svg>
                        <input
                            type="tel"
                            id="phone-input"
                            name="phone"
                            autocomplete="tel"
                            placeholder="WhatsApp / Mobile number"
                            class="w-full bg-transparent text-sm sm:text-xs text-gray-100 placeholder-gray-400 focus:outline-none"
                        />
                    </div>
                    <!-- Email -->
                    <div
                        class="flex items-center bg-[#0b172a]/90 border border-slate-700/60 rounded-lg px-3 py-2 sm:px-2 sm:py-1.5 gold-focus transition"
                    >
                        <svg
                            class="w-4 h-4 text-gray-400 shrink-0 mr-2 sm:mr-1.5 fill-none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                            />
                        </svg>
                        <input
                            type="email"
                            id="email-input"
                            name="email"
                            autocomplete="email"
                            placeholder="Email address (optional)"
                            class="w-full bg-transparent text-sm sm:text-xs text-gray-100 placeholder-gray-400 focus:outline-none"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    id="notify-btn"
                    class="w-full bg-gradient-to-r from-[#e5a93c] to-[#d4af37] hover:brightness-110 active:scale-[0.99] text-[#070e1b] font-bold py-3 sm:py-2.5 rounded-lg text-xs tracking-wider uppercase transition shadow-lg"
                >
                    GET NOTIFIED
                </button>
            </div>

            <p class="text-[10px] sm:text-xs text-amber-200/95 font-medium mt-2 text-center drop-shadow">
                Add WhatsApp number, email, or both &ndash; we'll notify you first.
            </p>
            <div
                id="notify-feedback"
                class="mt-2.5 text-xs md:text-sm hidden transition-all duration-300"
            ></div>
        </form>
    </div>
</main>
