name: Deploy Punjab's Attire to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Google Sheet Secret URL
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          if [ -n "$GOOGLE_SHEET_URL" ]; then
            sed -i "s|{{GOOGLE_SHEET_URL}}|$GOOGLE_SHEET_URL|g" assets/js/main.js
            echo "Successfully injected Google Sheet secret."
          else
            echo "::warning::GOOGLE_SHEET_URL secret is not set in repository settings! Submissions will fall back to local mode."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

